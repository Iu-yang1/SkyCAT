name: Windows build

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SkyCat.sln

      - name: Test
        run: dotnet test SkyCat.sln -c Release --no-restore

      - name: Publish skycatd win-x64
        run: dotnet publish skycatd/skycatd.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/skycatd-win-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: skycatd-wsjtx-win-x64
          path: artifacts/skycatd-win-x64
          if-no-files-found: error
