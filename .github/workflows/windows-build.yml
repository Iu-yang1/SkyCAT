name: Windows build

on:
  push:
    branches:
      - master
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SkyCat.sln --locked-mode

      - name: Test
        run: dotnet test SkyCat.sln -c Release --no-restore

      - name: Publish skycatd win-x64
        run: dotnet publish skycatd/skycatd.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/skycatd-win-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skycatd-wsjtx-win-x64
          path: artifacts/skycatd-win-x64
          if-no-files-found: error
