name: Publish official SkyCAT release

on:
  push:
    branches: [master]
    paths:
      - 'SkyCat/SkyCat.csproj'
      - 'skycatd/skycatd.csproj'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Verify version and new tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref }}' -ne 'refs/heads/master') { throw 'Only master can publish official releases' }
          $app = [xml](Get-Content skycatd/skycatd.csproj -Raw)
          $lib = [xml](Get-Content SkyCat/SkyCat.csproj -Raw)
          $version = [string]$app.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          if ($version -ne [string]$lib.Project.PropertyGroup.Version) { throw 'SkyCAT library/app versions disagree' }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing to overwrite $tag" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore SkyCat.sln --locked-mode

      - name: Run complete SkyCAT tests
        shell: pwsh
        run: dotnet test SkyCat.sln -c Release --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish skycatd/skycatd.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/skycatd-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'skycatd publish failed' }

      - name: Bundle binary, rig commandsets and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "skycatd-$env:RELEASE_TAG-win-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path 'artifacts/skycatd-win-x64/*' -DestinationPath "dist/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $publish = Get-ChildItem 'artifacts/skycatd-win-x64/Rigs' -ErrorAction SilentlyContinue
          if (-not $publish) { throw 'Release is missing radio commandsets (Rigs)' }

      - name: Publish immutable official GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "skycatd-$env:RELEASE_TAG-win-x64.zip"
          @"
          SkyCAT $env:RELEASE_TAG — formal Windows x64 release

          - Verified with the locked .NET 9 restore and complete SkyCat.sln test suite.
          - Includes skycatd self-contained win-x64 binary and radio commandset JSONs.
          - Preserves SkyRoof embedded SkyCAT CAT/PTT lease isolation and the restricted WSJT-X proxy.
          - IMPORTANT: 4534 accepts non-PTT writes as no-ops; do not use it as an independent full CAT controller for TX-5DR.
          - See docs/tx5dr-interoperability.md and docs/skycatd.md for safe integration.
          - Windows binary is not claimed to be Authenticode signed.

          中文：Windows x64 正式版本；包含 CI 验证的独立 skycatd 和 Rigs 命令集。4534 为 WSJT-X 受限代理，不支持 TX-5DR 自主调频。未声明 Windows 签名。
          "@ | Set-Content dist/RELEASE_NOTES.md -Encoding utf8
          gh release create $env:RELEASE_TAG "dist/$name" dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SkyCAT $env:RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
